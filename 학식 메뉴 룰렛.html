<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>오늘 학식 뭐 먹지? 🍚 메뉴 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #fff4f8;
    --bg2: #eaf6ff;
    --ink: #4a3b52;
    --pink: #ff7eb3;
    --pink-dark: #f2559a;
    --yellow: #ffd66b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 20%, #ffe3ef 0 80px, transparent 81px),
      radial-gradient(circle at 85% 12%, #dff1ff 0 60px, transparent 61px),
      radial-gradient(circle at 90% 85%, #fff1c9 0 90px, transparent 91px),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
    overflow-x: hidden;
  }

  header { text-align: center; margin-bottom: 18px; }
  header .badge {
    display: inline-block;
    background: #fff;
    border: 2px solid #ffd0e3;
    color: var(--pink-dark);
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  header h1 {
    font-size: clamp(26px, 7vw, 38px);
    letter-spacing: -0.5px;
    text-shadow: 3px 3px 0 #ffe0ec;
  }
  header p { margin-top: 6px; font-size: clamp(14px, 3.8vw, 17px); color: #8a7a93; }

  /* ---------- 룰렛 ---------- */
  .wheel-wrap {
    position: relative;
    width: min(88vw, 420px);
    aspect-ratio: 1 / 1;
    margin: 10px auto 0;
  }
  .wheel-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #fff;
    padding: 10px;
    box-shadow: 0 12px 30px rgba(242, 85, 154, 0.22), inset 0 0 0 4px #ffd0e3;
  }
  .wheel-ring::before {
    /* 테두리 전구 장식 */
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: repeating-conic-gradient(var(--yellow) 0 4deg, transparent 4deg 22.5deg);
    -webkit-mask: radial-gradient(circle, transparent calc(50% - 6px), #000 calc(50% - 5px));
            mask: radial-gradient(circle, transparent calc(50% - 6px), #000 calc(50% - 5px));
    opacity: .9;
  }
  #wheel {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    transform: rotate(0deg);
    will-change: transform;
  }
  #wheel.spinning {
    transition: transform 3s cubic-bezier(0.12, 0.6, 0.1, 1);
  }

  /* 상단 화살표 */
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 54px;
    z-index: 3;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.15));
  }
  .pointer.bounce { animation: tick .12s ease-in-out infinite alternate; }
  @keyframes tick { from { transform: translateX(-50%) rotate(-6deg); } to { transform: translateX(-50%) rotate(6deg); } }

  /* 가운데 버튼 */
  .spin-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 27%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 6px solid #fff;
    background: radial-gradient(circle at 35% 30%, #ff9cc6, var(--pink-dark));
    color: #fff;
    font-family: inherit;
    font-size: clamp(17px, 5vw, 24px);
    cursor: pointer;
    z-index: 4;
    box-shadow: 0 6px 0 #d63d82, 0 10px 20px rgba(214, 61, 130, .35);
    transition: transform .12s, box-shadow .12s, filter .2s;
    text-shadow: 0 2px 0 rgba(0,0,0,.12);
  }
  .spin-btn:hover { filter: brightness(1.05); }
  .spin-btn:active { transform: translate(-50%, calc(-50% + 4px)); box-shadow: 0 2px 0 #d63d82, 0 4px 10px rgba(214,61,130,.3); }
  .spin-btn:disabled { cursor: default; filter: grayscale(.25) brightness(.95); }
  .spin-btn .small { display: block; font-size: .55em; opacity: .9; margin-top: 2px; }

  /* 최근 결과 */
  .history {
    margin-top: 26px;
    width: min(92vw, 440px);
    background: rgba(255,255,255,.75);
    border: 2px dashed #ffc6dd;
    border-radius: 20px;
    padding: 12px 14px;
    text-align: center;
  }
  .history h2 { font-size: 15px; color: #a28aa8; font-weight: normal; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 30px; }
  .chip {
    background: #fff;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 14px;
    box-shadow: 0 2px 0 #f3d9e5;
    animation: pop .3s ease-out;
  }
  .chips .empty { font-size: 14px; color: #c0b2c6; line-height: 30px; }

  /* ---------- 메뉴 편집 ---------- */
  .editor {
    margin-top: 26px;
    width: min(92vw, 440px);
    background: rgba(255,255,255,.85);
    border: 2px solid #ffd0e3;
    border-radius: 20px;
    padding: 14px;
  }
  .editor-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .editor h2 { font-size: 16px; font-weight: normal; }
  .count { font-size: 13px; color: #a28aa8; background: #fff4f8; padding: 2px 10px; border-radius: 999px; }
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1;
    min-width: 0;
    border: 2px solid #ffd0e3;
    border-radius: 14px;
    padding: 11px 14px;
    font-family: inherit;
    font-size: 16px; /* iOS 자동 확대 방지 */
    color: var(--ink);
    background: #fff;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .add-row input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,126,179,.18); }
  .add-row input::placeholder { color: #c9bccd; }
  .add-btn {
    border: none;
    border-radius: 14px;
    padding: 0 18px;
    background: var(--pink);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 0 #d63d82;
    transition: transform .1s, box-shadow .1s;
  }
  .add-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d63d82; }
  .add-btn:disabled { opacity: .5; cursor: default; }
  .hint { min-height: 18px; margin: 8px 2px 8px; font-size: 13px; color: #a28aa8; }
  .hint.warn { color: var(--pink-dark); }
  .menu-list { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 4px 4px 12px;
    border-radius: 999px;
    font-size: 14px;
  }
  .del-btn {
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.75);
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .del-btn:hover { background: #fff; color: var(--pink-dark); }
  .del-btn:disabled { opacity: .35; cursor: default; }
  .reset-btn {
    margin-top: 12px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: #a28aa8;
    text-decoration: underline;
    cursor: pointer;
  }
  .reset-btn:disabled { opacity: .5; cursor: default; }

  footer { margin-top: 18px; font-size: 12px; color: #b3a5b9; }

  /* ---------- 결과 모달 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(74, 59, 82, .45);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .result-card {
    position: relative;
    width: min(90vw, 380px);
    background: #fff;
    border-radius: 32px;
    padding: 30px 22px 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.2);
    transform: scale(.6);
    transition: transform .4s cubic-bezier(.34, 1.56, .64, 1);
    overflow: hidden;
  }
  .overlay.show .result-card { transform: scale(1); }
  .result-card::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 110px;
    background: var(--card-color, #ffe0ec);
    border-radius: 0 0 50% 50% / 0 0 40px 40px;
    z-index: 0;
  }
  .result-card > * { position: relative; z-index: 1; }
  .result-label { font-size: 16px; color: #7c6684; }
  .result-emoji {
    font-size: clamp(72px, 22vw, 96px);
    line-height: 1.1;
    margin: 6px 0 4px;
    animation: wiggle 1s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.08); } }
  .result-name {
    font-size: clamp(40px, 13vw, 56px);
    color: var(--pink-dark);
    letter-spacing: -1px;
    text-shadow: 3px 3px 0 #ffe0ec;
  }
  .result-comment { margin-top: 8px; font-size: 16px; color: #8a7a93; }
  .btn-row { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: 16px;
    padding: 14px 0;
    font-family: inherit;
    font-size: 17px;
    cursor: pointer;
    transition: transform .1s;
  }
  .btn:active { transform: translateY(3px); }
  .btn.primary { background: var(--pink); color: #fff; box-shadow: 0 4px 0 #d63d82; }
  .btn.ghost { background: #f4eef6; color: var(--ink); box-shadow: 0 4px 0 #ddd1e2; }

  /* 꽃가루 */
  .confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 14px;
    border-radius: 3px;
    z-index: 11;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .7; }
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .result-emoji { animation: none; }
  }
</style>
</head>
<body>

  <header>
    <div class="badge">🍽️ 오늘의 학식 고민 해결사</div>
    <h1>오늘 점심 뭐 먹지?</h1>
    <p>고민은 룰렛에게 맡기고, 줄부터 서자! 🏃</p>
  </header>

  <div class="wheel-wrap">
    <svg class="pointer" id="pointer" viewBox="0 0 44 54" aria-hidden="true">
      <path d="M22 52 L4 14 A18 18 0 1 1 40 14 Z" fill="#ff7eb3" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="22" cy="16" r="6" fill="#fff"/>
    </svg>
    <div class="wheel-ring">
      <canvas id="wheel"></canvas>
    </div>
    <button class="spin-btn" id="spinBtn" aria-label="룰렛 돌리기">
      돌리기
      <span class="small">GO!</span>
    </button>
  </div>

  <section class="editor" aria-labelledby="editorTitle">
    <div class="editor-head">
      <h2 id="editorTitle">✏️ 메뉴 편집</h2>
      <span class="count" id="menuCount">8/16</span>
    </div>
    <form class="add-row" id="addForm" autocomplete="off">
      <input id="menuInput" type="text" maxlength="10" placeholder="추가할 메뉴 (예: 떡볶이)" aria-label="추가할 메뉴 이름" />
      <button class="add-btn" id="addBtn" type="submit">추가</button>
    </form>
    <p class="hint" id="editorHint">× 를 누르면 삭제돼요. 최소 2개, 최대 16개까지!</p>
    <ul class="menu-list" id="menuList"></ul>
    <button class="reset-btn" id="resetBtn" type="button">기본 메뉴로 되돌리기</button>
  </section>

  <section class="history">
    <h2>🕒 최근 결과</h2>
    <div class="chips" id="chips"><span class="empty">아직 돌린 기록이 없어요</span></div>
  </section>

  <footer>맛있게 먹고 오후 수업도 힘내요 💪</footer>

  <!-- 결과 모달 -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="resultName">
    <div class="result-card" id="resultCard">
      <div class="result-label">오늘의 학식은 바로~!</div>
      <div class="result-emoji" id="resultEmoji">🍚</div>
      <div class="result-name" id="resultName">메뉴</div>
      <div class="result-comment" id="resultComment"></div>
      <div class="btn-row">
        <button class="btn ghost" id="closeBtn">좋아요 👍</button>
        <button class="btn primary" id="againBtn">다시 돌리기 🔄</button>
      </div>
    </div>
  </div>

<script>
  // 칸 색상 팔레트 (순서대로 돌아가며 사용)
  const PALETTE = ['#FFB3C7', '#FFD59E', '#FFF1A8', '#C8F2C2', '#B5E6F5', '#CFC6FF', '#F7C6F0', '#FFCBA8', '#BDEBD9', '#FFC2B4'];

  const DEFAULT_MENUS = [
    { name: '돈까스',   emoji: '🍤', comment: '바삭바삭 겉바속촉! 소스 듬뿍 🧡' },
    { name: '김치찌개', emoji: '🍲', comment: '얼큰하게 속 풀고 밥 한 공기 뚝딱!' },
    { name: '비빔밥',   emoji: '🍚', comment: '고추장 한 숟갈, 슥슥 비벼 먹자 🌶️' },
    { name: '라면',     emoji: '🍜', comment: '꼬들꼬들 면발에 계란 하나 추가?' },
    { name: '제육덮밥', emoji: '🥩', comment: '매콤달콤 고기 듬뿍, 든든함 MAX!' },
    { name: '샐러드',   emoji: '🥗', comment: '오늘은 가볍고 상큼하게 🥬' },
    { name: '짜장면',   emoji: '🍝', comment: '입가에 짜장 묻는 건 국룰 😋' },
    { name: '카레',     emoji: '🍛', comment: '향긋한 카레에 밥 비벼 한 입!' },
  ];

  // 새로 추가한 메뉴는 이름을 보고 이모지를 골라줌
  const EMOJI_HINTS = [
    [/라면|라멘|우동|국수|냉면|소바|쌀국수/, '🍜'],
    [/짜장|짬뽕|파스타|스파게티/, '🍝'],
    [/찌개|탕|국밥|전골|국/, '🍲'],
    [/카레/, '🍛'],
    [/샐러드|포케/, '🥗'],
    [/돈까스|돈가스|까스|커틀릿|튀김/, '🍤'],
    [/피자/, '🍕'],
    [/버거/, '🍔'],
    [/치킨|닭/, '🍗'],
    [/초밥|스시|회/, '🍣'],
    [/김밥|주먹밥/, '🍙'],
    [/떡볶이|어묵|오뎅/, '🍢'],
    [/샌드위치|토스트|빵/, '🥪'],
    [/만두/, '🥟'],
    [/타코|부리또/, '🌮'],
    [/마라/, '🌶️'],
    [/고기|제육|불고기|삼겹|갈비|스테이크|보쌈|족발/, '🥩'],
    [/밥/, '🍚'],
  ];
  const COMMENTS = [
    n => `오늘은 ${n}! 맛있게 먹자 😋`,
    n => `${n}(으)로 든든하게 충전 완료! 🔋`,
    n => `룰렛이 골랐다, ${n} 가즈아! 🏃`,
    n => `고민 끝! 오늘의 정답은 ${n} ✨`,
  ];
  function guessEmoji(name) {
    const hit = EMOJI_HINTS.find(([re]) => re.test(name));
    return hit ? hit[1] : '🍽️';
  }
  function makeComment(name) {
    return COMMENTS[Math.floor(Math.random() * COMMENTS.length)](name);
  }

  // 메뉴 목록은 브라우저에 저장해서 새로고침해도 유지
  const STORAGE_KEY = 'hakshik-roulette-menus';
  const MIN_MENUS = 2;
  const MAX_MENUS = 16;

  function loadMenus() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved) && saved.length >= MIN_MENUS && saved.every(m => m && typeof m.name === 'string')) {
        return saved.slice(0, MAX_MENUS).map(m => ({
          name: m.name.slice(0, 10),
          emoji: m.emoji || guessEmoji(m.name),
          comment: m.comment || makeComment(m.name),
        }));
      }
    } catch (e) { /* 저장소 사용 불가 시 기본값 */ }
    return DEFAULT_MENUS.map(m => ({ ...m }));
  }
  function saveMenus() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(MENUS)); } catch (e) {}
  }

  let MENUS = loadMenus();

  // i번째 칸 색 (마지막 칸이 첫 칸과 같은 색이 되지 않도록 보정)
  function colorOf(i) {
    let idx = i % PALETTE.length;
    if (i === MENUS.length - 1 && i > 0 && idx === 0) idx = 5;
    return PALETTE[idx];
  }

  const SPIN_MS = 3000;

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const pointer = document.getElementById('pointer');
  const overlay = document.getElementById('overlay');
  const chips = document.getElementById('chips');

  let rotation = 0;      // 누적 회전 각도(도)
  let spinning = false;
  const history = [];

  /* ---------- 룰렛 그리기 ---------- */
  function drawWheel() {
    const size = canvas.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const c = size / 2;
    const r = size / 2;
    const segRad = (Math.PI * 2) / MENUS.length;
    const k = Math.min(1, Math.sqrt(8 / MENUS.length)); // 칸이 많으면 글씨를 작게
    const nameSize = Math.max(11, size * 0.05 * k);
    const emojiSize = Math.max(14, size * 0.075 * k);
    const nameFont = s => `${s}px Jua, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    // 칸 안에 들어갈 수 있는 글자 최대 너비
    const maxNameW = Math.min(r * 0.6, 2 * r * 0.66 * Math.sin(segRad / 2) * 0.85);

    ctx.clearRect(0, 0, size, size);

    MENUS.forEach((m, i) => {
      // 12시 방향에서 시계방향으로 i번째 칸
      const start = -Math.PI / 2 + i * segRad;
      const end = start + segRad;

      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, start, end);
      ctx.closePath();
      ctx.fillStyle = colorOf(i);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // 글자
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(start + segRad / 2);
      ctx.translate(r * 0.66, 0);
      ctx.rotate(Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = `${emojiSize}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(m.emoji, 0, -emojiSize * 0.55);

      // 긴 이름은 칸에 맞게 글씨 크기를 줄임
      let fs = nameSize;
      ctx.font = nameFont(fs);
      const w = ctx.measureText(m.name).width;
      if (w > maxNameW) {
        fs = Math.max(9, fs * maxNameW / w);
        ctx.font = nameFont(fs);
      }
      ctx.fillStyle = '#4a3b52';
      ctx.fillText(m.name, 0, nameSize * 0.85);
      ctx.restore();
    });

    // 가운데 흰 원(버튼 받침)
    ctx.beginPath();
    ctx.arc(c, c, r * 0.17, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  /* ---------- 돌리기 ---------- */
  function spin() {
    if (spinning || MENUS.length < MIN_MENUS) return;
    spinning = true;
    spinBtn.disabled = true;
    pointer.classList.add('bounce');
    closeResult();
    renderEditor(); // 도는 동안 편집 잠금

    const SEG = 360 / MENUS.length;
    const index = Math.floor(Math.random() * MENUS.length);
    // 칸 안에서 살짝 랜덤한 위치에 멈추도록 (경계선은 피함)
    const jitter = (Math.random() - 0.5) * SEG * 0.7;
    const targetLocal = index * SEG + SEG / 2 + jitter; // 12시 기준 시계방향 각도
    const targetMod = ((360 - targetLocal) % 360 + 360) % 360;
    const currentMod = ((rotation % 360) + 360) % 360;
    const delta = ((targetMod - currentMod) + 360) % 360;
    rotation += 360 * 6 + delta;

    canvas.classList.add('spinning');
    canvas.style.transform = `rotate(${rotation}deg)`;

    if (navigator.vibrate) navigator.vibrate(30);

    setTimeout(() => {
      canvas.classList.remove('spinning');
      pointer.classList.remove('bounce');
      spinning = false;
      spinBtn.disabled = false;
      renderEditor();
      showResult({ ...MENUS[index], color: colorOf(index) });
    }, SPIN_MS + 50);
  }

  /* ---------- 결과 ---------- */
  function showResult(menu) {
    document.getElementById('resultEmoji').textContent = menu.emoji;
    document.getElementById('resultName').textContent = menu.name;
    document.getElementById('resultComment').textContent = menu.comment;
    document.getElementById('resultCard').style.setProperty('--card-color', menu.color);
    overlay.classList.add('show');
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    confetti();
    addHistory(menu);
  }

  function closeResult() {
    overlay.classList.remove('show');
  }

  function addHistory(menu) {
    history.unshift(menu);
    if (history.length > 5) history.pop();
    chips.innerHTML = '';
    history.forEach(m => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = `${m.emoji} ${m.name}`;
      chips.appendChild(chip);
    });
  }

  function confetti() {
    const colors = PALETTE.concat(['#ff7eb3', '#ffd66b']);
    for (let i = 0; i < 50; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
      el.style.animationDelay = Math.random() * 0.3 + 's';
      el.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3600);
    }
  }

  /* ---------- 메뉴 편집 ---------- */
  const menuInput = document.getElementById('menuInput');
  const addBtn = document.getElementById('addBtn');
  const resetBtn = document.getElementById('resetBtn');
  const menuList = document.getElementById('menuList');
  const menuCount = document.getElementById('menuCount');
  const editorHint = document.getElementById('editorHint');

  function setHint(msg, warn) {
    editorHint.textContent = msg;
    editorHint.classList.toggle('warn', !!warn);
  }

  function renderEditor() {
    menuList.innerHTML = '';
    MENUS.forEach((m, i) => {
      const li = document.createElement('li');
      li.className = 'menu-item';
      li.style.background = colorOf(i);

      const label = document.createElement('span');
      label.textContent = `${m.emoji} ${m.name}`;

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del-btn';
      del.textContent = '×';
      del.setAttribute('aria-label', `${m.name} 삭제`);
      del.disabled = spinning || MENUS.length <= MIN_MENUS;
      del.addEventListener('click', () => removeMenu(i));

      li.append(label, del);
      menuList.appendChild(li);
    });
    menuCount.textContent = `${MENUS.length}/${MAX_MENUS}`;
    addBtn.disabled = spinning || MENUS.length >= MAX_MENUS;
    resetBtn.disabled = spinning;
  }

  function afterChange() {
    saveMenus();
    renderEditor();
    drawWheel();
  }

  function addMenu() {
    if (spinning) return;
    const name = menuInput.value.trim().replace(/\s+/g, ' ');
    if (!name) { setHint('메뉴 이름을 입력해 주세요 ✏️', true); menuInput.focus(); return; }
    if (MENUS.length >= MAX_MENUS) { setHint(`메뉴는 최대 ${MAX_MENUS}개까지 넣을 수 있어요`, true); return; }
    if (MENUS.some(m => m.name === name)) { setHint(`'${name}'은(는) 이미 룰렛에 있어요!`, true); menuInput.select(); return; }

    MENUS.push({ name, emoji: guessEmoji(name), comment: makeComment(name) });
    afterChange();
    menuInput.value = '';
    menuInput.focus();
    setHint(`'${name}' 추가 완료! 🎉`);
  }

  function removeMenu(i) {
    if (spinning) return;
    if (MENUS.length <= MIN_MENUS) { setHint(`메뉴는 최소 ${MIN_MENUS}개는 있어야 돌릴 수 있어요`, true); return; }
    const [removed] = MENUS.splice(i, 1);
    afterChange();
    setHint(`'${removed.name}' 삭제했어요 👋`);
  }

  function resetMenus() {
    if (spinning) return;
    if (!confirm('기본 메뉴 8개로 되돌릴까요?')) return;
    MENUS = DEFAULT_MENUS.map(m => ({ ...m }));
    afterChange();
    setHint('기본 메뉴로 되돌렸어요 🍱');
  }

  /* ---------- 이벤트 ---------- */
  spinBtn.addEventListener('click', spin);
  document.getElementById('againBtn').addEventListener('click', () => {
    closeResult();
    setTimeout(spin, 250);
  });
  document.getElementById('closeBtn').addEventListener('click', closeResult);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeResult(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeResult();
    // 입력창·버튼에 포커스가 있을 땐 단축키로 돌리지 않음
    const focused = (document.activeElement || {}).tagName;
    const typing = ['INPUT', 'TEXTAREA', 'BUTTON'].includes(focused);
    if ((e.key === ' ' || e.key === 'Enter') && !overlay.classList.contains('show') && !typing) {
      e.preventDefault();
      spin();
    }
  });

  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    addMenu();
  });
  resetBtn.addEventListener('click', resetMenus);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawWheel, 100);
  });

  // 폰트 로딩 후 다시 그려서 글씨체 반영
  renderEditor();
  drawWheel();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWheel);
</script>
</body>
</html>
