<index.html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자취생 한 달 가계부</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: #f4f6fb;
    color: #222;
    line-height: 1.5;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.05rem; margin-bottom: 14px; }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-nav button {
    border: none; background: #fff; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; font-size: 0.9rem; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .month-nav button:hover { background: #e9ecf5; }
  #monthLabel { font-weight: 700; font-size: 1.1rem; min-width: 110px; text-align: center; }
  #todayBtn {
    width: auto; padding: 0 12px; border-radius: 18px; font-size: 0.8rem;
  }

  .card {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 2px 10px rgba(30,40,90,.06);
  }

  /* 요약 */
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .sum-card { text-align: left; }
  .sum-card .label { font-size: 0.85rem; color: #777; }
  .sum-card .value { font-size: 1.4rem; font-weight: 800; margin-top: 4px; word-break: keep-all; }
  .income { color: #1c7ed6; }
  .expense { color: #e03131; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

  /* 폼 */
  form { display: flex; flex-direction: column; gap: 12px; }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-toggle input { display: none; }
  .type-toggle label {
    text-align: center; padding: 10px; border-radius: 10px; cursor: pointer;
    border: 2px solid #e5e8f0; font-weight: 600; color: #888; transition: .15s;
  }
  #typeExpense:checked + label { border-color: #e03131; color: #e03131; background: #fff5f5; }
  #typeIncome:checked + label { border-color: #1c7ed6; color: #1c7ed6; background: #f1f7ff; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field span { font-size: 0.8rem; color: #666; font-weight: 600; }
  .field input, .field select {
    padding: 10px 12px; border: 1px solid #dde1ea; border-radius: 10px;
    font-size: 0.95rem; font-family: inherit; background: #fff;
  }
  .field input:focus, .field select:focus { outline: 2px solid #748ffc; border-color: transparent; }
  .field select:disabled { background: #f1f3f5; color: #aaa; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .submit {
    margin-top: 4px; padding: 12px; border: none; border-radius: 10px;
    background: #4c6ef5; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .submit:hover { background: #3b5bdb; }

  /* 차트 */
  .chart-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
  #donut { width: 190px; height: 190px; flex-shrink: 0; }
  #donut circle.seg { transition: stroke-dasharray .4s; }
  .legend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; }
  .legend-item .dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .legend-item .name { flex: 1; }
  .legend-item .amt { font-weight: 700; }
  .legend-item .pct { color: #999; width: 42px; text-align: right; font-size: 0.8rem; }

  /* 표 */
  .table-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .table-head h2 { margin-bottom: 0; }
  #count { color: #999; font-weight: 500; font-size: 0.9rem; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 520px; }
  th, td { padding: 11px 8px; text-align: left; border-bottom: 1px solid #f0f1f5; }
  th { font-size: 0.8rem; color: #888; font-weight: 600; background: #fafbfd; }
  td.amount, th.amount { text-align: right; font-weight: 700; white-space: nowrap; }
  td.date { white-space: nowrap; color: #555; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
    border-radius: 20px; font-size: 0.8rem; background: #f1f3f5; white-space: nowrap;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
  .del {
    border: none; background: none; color: #bbb; cursor: pointer;
    font-size: 1rem; padding: 4px 8px; border-radius: 6px;
  }
  .del:hover { background: #fff0f0; color: #e03131; }
  .empty { text-align: center; color: #aaa; padding: 36px 0; }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .summary { grid-template-columns: 1fr; }
    .sum-card { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .sum-card .value { margin-top: 0; font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🏠 자취생 가계부</h1>
    <div class="month-nav">
      <button id="prevMonth" title="이전 달">◀</button>
      <span id="monthLabel"></span>
      <button id="nextMonth" title="다음 달">▶</button>
      <button id="todayBtn">이번 달</button>
    </div>
  </header>

  <!-- 요약 -->
  <section class="summary">
    <div class="card sum-card">
      <div class="label">총수입</div>
      <div class="value income" id="totalIncome">0원</div>
    </div>
    <div class="card sum-card">
      <div class="label">총지출</div>
      <div class="value expense" id="totalExpense">0원</div>
    </div>
    <div class="card sum-card">
      <div class="label">잔액</div>
      <div class="value" id="balance">0원</div>
    </div>
  </section>

  <div class="grid">
    <!-- 입력 폼 -->
    <section class="card">
      <h2>✏️ 내역 입력</h2>
      <form id="form" autocomplete="off">
        <div class="type-toggle">
          <input type="radio" name="type" id="typeExpense" value="expense" checked>
          <label for="typeExpense">지출</label>
          <input type="radio" name="type" id="typeIncome" value="income">
          <label for="typeIncome">수입</label>
        </div>
        <div class="row2">
          <label class="field">
            <span>날짜</span>
            <input type="date" id="date" required>
          </label>
          <label class="field">
            <span>카테고리</span>
            <select id="category">
              <option value="식비">🍚 식비</option>
              <option value="교통">🚌 교통</option>
              <option value="카페">☕ 카페</option>
              <option value="쇼핑">🛍️ 쇼핑</option>
              <option value="기타">📦 기타</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>내용</span>
          <input type="text" id="desc" placeholder="예) 편의점 도시락, 알바비" maxlength="40" required>
        </label>
        <label class="field">
          <span>금액 (원)</span>
          <input type="number" id="amount" placeholder="0" min="1" step="1" inputmode="numeric" required>
        </label>
        <button type="submit" class="submit">추가하기</button>
      </form>
    </section>

    <!-- 도넛 차트 -->
    <section class="card">
      <h2>📊 카테고리별 지출</h2>
      <div class="chart-wrap">
        <svg id="donut" viewBox="0 0 200 200"></svg>
        <div class="legend" id="legend"></div>
      </div>
    </section>
  </div>

  <!-- 내역 표 -->
  <section class="card">
    <div class="table-head">
      <h2>📋 내역 <span id="count"></span></h2>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>카테고리</th>
            <th>내용</th>
            <th class="amount">금액</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
  const STORAGE_KEY = 'jachi-budget-v1';
  const CATEGORIES = {
    식비: '#ff6b6b',
    교통: '#4dabf7',
    카페: '#b08968',
    쇼핑: '#f783ac',
    기타: '#adb5bd'
  };
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];

  // ---------- 데이터 ----------
  let items = load();
  const now = new Date();
  let view = { y: now.getFullYear(), m: now.getMonth() }; // m: 0~11

  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  // ---------- 유틸 ----------
  const $ = (id) => document.getElementById(id);
  const won = (n) => n.toLocaleString('ko-KR') + '원';
  const pad = (n) => String(n).padStart(2, '0');
  const monthKey = (y, m) => `${y}-${pad(m + 1)}`;
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function formatDate(str) {
    const [y, m, d] = str.split('-').map(Number);
    const w = WEEK[new Date(y, m - 1, d).getDay()];
    return `${pad(m)}.${pad(d)} (${w})`;
  }

  // ---------- 렌더링 ----------
  function render() {
    const key = monthKey(view.y, view.m);
    $('monthLabel').textContent = `${view.y}년 ${view.m + 1}월`;

    const list = items
      .filter((i) => i.date.startsWith(key))
      .sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);

    // 요약
    const income = list.filter((i) => i.type === 'income').reduce((s, i) => s + i.amount, 0);
    const expense = list.filter((i) => i.type === 'expense').reduce((s, i) => s + i.amount, 0);
    const balance = income - expense;
    $('totalIncome').textContent = won(income);
    $('totalExpense').textContent = won(expense);
    $('balance').textContent = (balance < 0 ? '-' : '') + won(Math.abs(balance));
    $('balance').style.color = balance < 0 ? '#e03131' : '#222';

    renderTable(list);
    renderDonut(list, expense);
  }

  function renderTable(list) {
    $('count').textContent = `${list.length}건`;
    const tbody = $('tbody');
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">이번 달 내역이 없어요. 첫 내역을 추가해 보세요!</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map((i) => {
      const isIncome = i.type === 'income';
      const catLabel = isIncome ? '수입' : i.category;
      const color = isIncome ? '#1c7ed6' : CATEGORIES[i.category];
      return `
        <tr>
          <td class="date">${formatDate(i.date)}</td>
          <td><span class="badge"><span class="dot" style="background:${color}"></span>${catLabel}</span></td>
          <td>${escapeHTML(i.desc)}</td>
          <td class="amount ${isIncome ? 'income' : 'expense'}">${isIncome ? '+' : '-'}${won(i.amount)}</td>
          <td><button class="del" data-id="${i.id}" title="삭제">✕</button></td>
        </tr>`;
    }).join('');
  }

  function renderDonut(list, totalExpense) {
    const svg = $('donut');
    const R = 70, C = 2 * Math.PI * R, SW = 28;
    const sums = Object.keys(CATEGORIES).map((cat) => ({
      cat,
      color: CATEGORIES[cat],
      amount: list.filter((i) => i.type === 'expense' && i.category === cat)
                  .reduce((s, i) => s + i.amount, 0)
    }));

    let html = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="#f1f3f5" stroke-width="${SW}"/>`;
    if (totalExpense > 0) {
      let offset = 0;
      sums.filter((s) => s.amount > 0).forEach((s) => {
        const len = (s.amount / totalExpense) * C;
        html += `<circle class="seg" cx="100" cy="100" r="${R}" fill="none"
                  stroke="${s.color}" stroke-width="${SW}"
                  stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}"
                  transform="rotate(-90 100 100)">
                  <title>${s.cat}: ${won(s.amount)}</title></circle>`;
        offset += len;
      });
    }
    html += `
      <text x="100" y="94" text-anchor="middle" font-size="12" fill="#888">총지출</text>
      <text x="100" y="116" text-anchor="middle" font-size="${totalExpense >= 10000000 ? 13 : 16}" font-weight="800" fill="#222">
        ${totalExpense > 0 ? won(totalExpense) : '지출 없음'}
      </text>`;
    svg.innerHTML = html;

    $('legend').innerHTML = sums
      .sort((a, b) => b.amount - a.amount)
      .map((s) => {
        const pct = totalExpense > 0 ? Math.round((s.amount / totalExpense) * 100) : 0;
        return `
          <div class="legend-item" style="opacity:${s.amount > 0 ? 1 : 0.4}">
            <span class="dot" style="background:${s.color}"></span>
            <span class="name">${s.cat}</span>
            <span class="amt">${won(s.amount)}</span>
            <span class="pct">${pct}%</span>
          </div>`;
      }).join('');
  }

  // ---------- 이벤트 ----------
  // 수입 선택 시 카테고리 비활성화
  document.querySelectorAll('input[name="type"]').forEach((r) =>
    r.addEventListener('change', () => {
      $('category').disabled = $('typeIncome').checked;
    })
  );

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const type = document.querySelector('input[name="type"]:checked').value;
    const date = $('date').value;
    const desc = $('desc').value.trim();
    const amount = Math.round(Number($('amount').value));

    if (!date || !desc || !amount || amount <= 0) {
      alert('날짜, 내용, 금액을 올바르게 입력해 주세요.');
      return;
    }

    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      type,
      date,
      desc,
      amount,
      category: type === 'income' ? null : $('category').value,
      created: Date.now()
    });
    save();

    // 입력한 날짜의 달로 화면 이동
    const [y, m] = date.split('-').map(Number);
    view = { y, m: m - 1 };

    $('desc').value = '';
    $('amount').value = '';
    $('desc').focus();
    render();
  });

  $('tbody').addEventListener('click', (e) => {
    const btn = e.target.closest('.del');
    if (!btn) return;
    const item = items.find((i) => i.id === btn.dataset.id);
    if (item && confirm(`'${item.desc}' 내역을 삭제할까요?`)) {
      items = items.filter((i) => i.id !== item.id);
      save();
      render();
    }
  });

  function moveMonth(diff) {
    const d = new Date(view.y, view.m + diff, 1);
    view = { y: d.getFullYear(), m: d.getMonth() };
    const isThisMonth = monthKey(view.y, view.m) === todayStr().slice(0, 7);
    $('date').value = isThisMonth ? todayStr() : `${monthKey(view.y, view.m)}-01`;
    render();
  }
  $('prevMonth').addEventListener('click', () => moveMonth(-1));
  $('nextMonth').addEventListener('click', () => moveMonth(1));
  $('todayBtn').addEventListener('click', () => {
    view = { y: now.getFullYear(), m: now.getMonth() };
    $('date').value = todayStr();
    render();
  });

  // ---------- 시작 ----------
  $('date').value = todayStr();
  render();
</script>
</body>
</html>
